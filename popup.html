<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>影院模式设置</title>
  <style>
    :root {
      /* 默认暗色模式 YouTube Ambient Design Tokens */
      --bg-color: #0f0f0f;
      --text-main: #f1f1f1;
      --text-title: #ffffff;
      --text-muted: #aaaaaa;
      --header-border: rgba(255, 255, 255, 0.1);
      
      --tabs-bg: rgba(255, 255, 255, 0.08);
      --tabs-border: transparent;
      --tab-btn-text: #aaaaaa;
      --tab-active-bg: #ffffff;
      --tab-active-text: #0f0f0f;
      --tab-active-shadow: rgba(0, 0, 0, 0.3);
      
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-title: #3ea6ff;
      
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-text: #f1f1f1;
      
      --kbd-bg: rgba(255, 255, 255, 0.12);
      --kbd-border: rgba(255, 255, 255, 0.2);
      --kbd-shadow: rgba(0, 0, 0, 0.4);
      --kbd-text: #3ea6ff;

      --history-item-bg: rgba(255, 255, 255, 0.04);
      --history-item-border: rgba(255, 255, 255, 0.07);
      --history-item-hover-bg: rgba(255, 255, 255, 0.08);
      --history-item-hover-border: rgba(255, 255, 255, 0.15);
      --history-title-color: #3ea6ff;

      --btn-primary-bg: #3ea6ff;
      --btn-primary-text: #0f0f0f;
    }

    @media (prefers-color-scheme: light) {
      :root {
        /* 设备亮色模式 YouTube Design Tokens */
        --bg-color: #ffffff;
        --text-main: #0f0f0f;
        --text-title: #0f0f0f;
        --text-muted: #606060;
        --header-border: #e5e5e5;
        
        --tabs-bg: #f2f2f2;
        --tabs-border: transparent;
        --tab-btn-text: #606060;
        --tab-active-bg: #0f0f0f;
        --tab-active-text: #ffffff;
        --tab-active-shadow: rgba(0, 0, 0, 0.15);
        
        --card-bg: #f9f9f9;
        --card-border: #e5e5e5;
        --card-title: #065fd4;
        
        --input-bg: #ffffff;
        --input-border: #ccc;
        --input-text: #0f0f0f;
        
        --kbd-bg: #f2f2f2;
        --kbd-border: #ccc;
        --kbd-shadow: #e5e5e5;
        --kbd-text: #065fd4;

        --history-item-bg: #f9f9f9;
        --history-item-border: #e5e5e5;
        --history-item-hover-bg: #f2f2f2;
        --history-item-hover-border: #ccc;
        --history-title-color: #065fd4;

        --btn-primary-bg: #065fd4;
        --btn-primary-text: #ffffff;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      width: 280px;
      height: max-content;
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      overflow: hidden;
    }
    body {
      width: 280px;
      height: auto;
      margin: 0;
      padding: 12px;
      background: var(--bg-color);
      font-family: "YouTube Noto", Roboto, Arial, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      user-select: none;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* 顶部 Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--header-border);
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-title);
      letter-spacing: -0.2px;
    }
    .brand-icon {
      width: 18px;
      height: 18px;
      color: #ff0000; /* YouTube 标志性红色点缀 */
    }

    /* YouTube 风格圆角 Segmented Control (Pill Chips) */
    .tabs-container {
      display: flex;
      background: var(--tabs-bg);
      border-radius: 12px; /* 圆角几何数提升 */
      padding: 3px;
      margin-bottom: 10px;
      border: 1px solid var(--tabs-border);
      width: 100%;
    }
    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: var(--tab-btn-text);
      padding: 6px 0;
      border-radius: 9px; /* YouTube 胶囊小内嵌圆角 */
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease-in-out;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: 0 2px 8px var(--tab-active-shadow);
    }
    .tab-btn:hover:not(.active) {
      color: var(--text-title);
    }
    .tab-icon {
      width: 13px;
      height: 13px;
      stroke-width: 2;
    }
    .badge {
      background: rgba(62, 166, 255, 0.18);
      color: var(--card-title);
      font-size: 9.5px;
      font-weight: 600;
      padding: 1.5px 6px;
      border-radius: 12px; /* Pill 边缘弧度 */
      line-height: 1.2;
    }

    .tab-panel {
      width: 100%;
    }

    /* YouTube 风格的大圆角 Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px; /* YouTube 标志性 12px 圆角 */
      padding: 10px 11px;
      margin-bottom: 10px;
      width: 100%;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--card-title);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 表单控件圆角与规范 */
    .form-group {
      margin-bottom: 8px;
      width: 100%;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      width: 100%;
    }

    input[type="number"], select, input[type="text"] {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      padding: 5px 8px;
      border-radius: 8px; /* 输入框圆角增大至 8px */
      font-size: 11.5px;
      outline: none;
      transition: all 0.15s ease;
      min-width: 0;
      width: 100%;
    }
    input[type="number"]:focus, select:focus, input[type="text"]:focus {
      border-color: var(--card-title);
      box-shadow: 0 0 0 2px rgba(62, 166, 255, 0.2);
    }

    /* 快捷键 KBD 键帽圆角 */
    .kbd-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-align: center;
      text-transform: lowercase;
      font-weight: 700;
      background: var(--kbd-bg) !important;
      border-color: var(--kbd-border) !important;
      border-radius: 7px !important; /* 物理按键独立圆角 */
      box-shadow: inset 0 -2px 0 var(--kbd-shadow);
      color: var(--kbd-text) !important;
      width: 30px !important;
      height: 26px;
      padding: 0 !important;
      flex-shrink: 0;
    }

    /* 颜色选择器 Webkit 圆角修正 */
    .color-picker {
      height: 28px;
      padding: 2px;
      cursor: pointer;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      width: 100%;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 6px; /* 色块内部圆角化 */
    }

    /* YouTube Pill Button 纯圆角主按钮 (20px 圆角) */
    .save-btn {
      width: 100%;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border: none;
      padding: 8.5px;
      border-radius: 20px; /* 经典 YouTube 胶囊式 Pill 按钮大圆角 */
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease-in-out;
    }
    .save-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .save-btn:active {
      transform: translateY(0);
    }
    .tip-status {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 5px;
      margin-bottom: 0;
      text-align: center;
      transition: color 0.2s;
      line-height: 1.2;
    }

    /* 历史记录圆角项 */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      width: 100%;
    }
    .history-sub {
      font-size: 10px;
      color: var(--text-muted);
    }
    .clear-btn {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px; /* 圆角清空按钮 */
      padding: 2.5px 8px;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .history-list {
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--input-border);
      border-radius: 10px;
    }

    .history-item {
      background: var(--history-item-bg);
      border: 1px solid var(--history-item-border);
      border-radius: 10px; /* 历史纪录卡片圆角提升 */
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: all 0.18s ease;
      width: 100%;
    }
    .history-item:hover {
      background: var(--history-item-hover-bg);
      border-color: var(--history-item-hover-border);
      transform: translateY(-1px);
    }
    .history-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .history-title {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--history-title-color);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      width: 100%;
    }
    .history-title:hover {
      text-decoration: underline;
    }
    .history-time {
      font-size: 9.5px;
      color: var(--text-muted);
    }
    .history-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .history-item:hover .history-delete-btn {
      opacity: 1;
    }
    .history-delete-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }
    .history-empty {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      width: 100%;
    }
    .history-empty-icon {
      font-size: 22px;
      margin-bottom: 3px;
      opacity: 0.6;
    }
    .history-empty-text {
      font-size: 11px;
    }
  </style>
</head>
<body>
  <!-- Header 头部品牌栏 -->
  <div class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>
      一键影院模式
    </div>
  </div>

  <!-- 分段选项卡 Segmented Control -->
  <div class="tabs-container">
    <button class="tab-btn active" id="tabSettingsBtn">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      偏好设置
    </button>
    <button class="tab-btn" id="tabHistoryBtn">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      观看历史 <span id="historyCount" class="badge">0</span>
    </button>
  </div>

  <!-- 偏好设置面板 -->
  <div id="settingsTab" class="tab-panel">
    <div class="card">
      <div class="card-title">快捷键与时间步长</div>
      <div class="form-group">
        <label>回退时长 & 触发键</label>
        <div class="row">
          <input type="number" id="jValue" min="1" step="any" value="60" style="flex:1;">
          <select id="jUnit" style="width: 52px; flex-shrink: 0;">
            <option value="s">秒</option>
            <option value="m" selected>分</option>
            <option value="h">时</option>
          </select>
          <div style="display:flex; align-items:center; gap:4px; flex-shrink: 0;">
            <span style="font-size:11px; color:var(--text-muted);">键:</span>
            <input type="text" id="jKey" class="kbd-input" maxlength="1" value="j" title="触发按键">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>快进时长 & 触发键</label>
        <div class="row">
          <input type="number" id="lValue" min="1" step="any" value="60" style="flex:1;">
          <select id="lUnit" style="width: 52px; flex-shrink: 0;">
            <option value="s">秒</option>
            <option value="m" selected>分</option>
            <option value="h">时</option>
          </select>
          <div style="display:flex; align-items:center; gap:4px; flex-shrink: 0;">
            <span style="font-size:11px; color:var(--text-muted);">键:</span>
            <input type="text" id="lKey" class="kbd-input" maxlength="1" value="l" title="触发按键">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>遮罩层透明度 (0.0 - 1.0)</label>
        <input type="number" id="opacity" min="0" max="1" step="0.05" value="0.88">
      </div>
    </div>

    <div class="card">
      <div class="card-title">字幕外观配置</div>
      <div class="form-group">
        <label>字体大小 (px)</label>
        <input type="number" id="subFontSize" min="12" max="48" step="1" value="18">
      </div>

      <div class="form-group">
        <div class="row">
          <div style="flex:1;">
            <label>字体颜色</label>
            <input type="color" id="subFontColor" class="color-picker" value="#ffffff">
          </div>
          <div style="flex:1;">
            <label>背景颜色</label>
            <input type="color" id="subBgColor" class="color-picker" value="#000000">
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="row">
          <div style="flex:1;">
            <label>背景透明度 (0-1)</label>
            <input type="number" id="subBgOpacity" min="0" max="1" step="0.05" value="0.6">
          </div>
          <div style="flex:1;">
            <label>字体粗细</label>
            <select id="subFontWeight">
              <option value="400">常规 (Normal)</option>
              <option value="500" selected>中等 (Medium)</option>
              <option value="700">加粗 (Bold)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>底部偏移量 (px)</label>
        <input type="number" id="subBottomOffset" min="10" max="200" step="5" value="30">
      </div>
    </div>

    <button class="save-btn" id="save">保存偏好设置</button>
    <div class="tip-status" id="status">修改设置后即时生效</div>
  </div>

  <!-- 历史记录面板 -->
  <div id="historyTab" class="tab-panel" style="display:none;">
    <div class="history-header">
      <span class="history-sub">自动保留播放满1分钟（最新90条）</span>
      <button id="clearHistoryBtn" class="clear-btn">清空全部</button>
    </div>
    <div id="historyList" class="history-list">
      <!-- 动态插入历史卡片 -->
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
