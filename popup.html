<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>影院模式设置</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f1015;
      color: #e4e4e7;
      padding: 14px;
      user-select: none;
    }

    /* 顶部 Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.2px;
    }
    .brand-icon {
      width: 20px;
      height: 20px;
      color: #3b82f6;
    }

    /* 分段 Segmented Control (Tabs) */
    .tabs-container {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #a1a1aa;
      padding: 7px 0;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn.active {
      background: #27272a;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .tab-btn:hover:not(.active) {
      color: #e4e4e7;
    }
    .tab-icon {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }
    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      line-height: 1.2;
    }

    /* 卡片式区块 (Card Sections) */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 表单与输入框 */
    .form-group {
      margin-bottom: 10px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 11.5px;
      color: #a1a1aa;
      margin-bottom: 5px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="number"], select, input[type="text"] {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 12.5px;
      outline: none;
      transition: all 0.15s ease;
    }
    input[type="number"]:focus, select:focus, input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    /* 快捷键 KBD 单字符样式 */
    .kbd-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-align: center;
      text-transform: lowercase;
      font-weight: 700;
      background: #27272a !important;
      border-color: #52525b !important;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.4);
      color: #60a5fa !important;
    }

    /* 颜色选择器 */
    .color-picker {
      height: 32px;
      padding: 2px;
      cursor: pointer;
      background: #18181b;
      border-radius: 6px;
    }

    /* 主操作按钮 */
    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.15s ease;
    }
    .save-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }
    .save-btn:active {
      transform: translateY(0);
    }
    .tip-status {
      font-size: 11px;
      color: #71717a;
      margin-top: 8px;
      text-align: center;
      transition: color 0.2s;
    }

    /* 历史记录 Tab 相关 */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .history-sub {
      font-size: 11.5px;
      color: #71717a;
    }
    .clear-btn {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #ef4444;
    }

    .history-list {
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 2px;
    }
    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .history-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }
    .history-info {
      flex: 1;
      min-width: 0;
    }
    .history-title {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #60a5fa;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .history-title:hover {
      text-decoration: underline;
    }
    .history-time {
      font-size: 10.5px;
      color: #71717a;
    }
    .history-delete-btn {
      background: transparent;
      border: none;
      color: #71717a;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      opacity: 0.7;
    }
    .history-item:hover .history-delete-btn {
      opacity: 1;
    }
    .history-delete-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }
    .history-empty {
      text-align: center;
      padding: 36px 0;
      color: #71717a;
    }
    .history-empty-icon {
      font-size: 28px;
      margin-bottom: 6px;
      opacity: 0.6;
    }
    .history-empty-text {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- Header 头部品牌栏 -->
  <div class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      一键影院模式
    </div>
  </div>

  <!-- 分段选项卡 Segmented Control -->
  <div class="tabs-container">
    <button class="tab-btn active" id="tabSettingsBtn">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      偏好设置
    </button>
    <button class="tab-btn" id="tabHistoryBtn">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      观看历史 <span id="historyCount" class="badge">0</span>
    </button>
  </div>

  <!-- 偏好设置面板 -->
  <div id="settingsTab">
    <div class="card">
      <div class="card-title">快捷键与时间步长</div>
      <div class="form-group">
        <label>回退按键 & 时长</label>
        <div class="row">
          <div style="flex:2.2; display:flex; gap:6px;">
            <input type="number" id="jValue" min="1" step="any" value="60" style="flex:2;">
            <select id="jUnit" style="flex:1.2;">
              <option value="s">秒</option>
              <option value="m" selected>分</option>
              <option value="h">时</option>
            </select>
          </div>
          <div style="flex:1;">
            <input type="text" id="jKey" class="kbd-input" maxlength="1" value="j" title="按键">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>快进按键 & 时长</label>
        <div class="row">
          <div style="flex:2.2; display:flex; gap:6px;">
            <input type="number" id="lValue" min="1" step="any" value="60" style="flex:2;">
            <select id="lUnit" style="flex:1.2;">
              <option value="s">秒</option>
              <option value="m" selected>分</option>
              <option value="h">时</option>
            </select>
          </div>
          <div style="flex:1;">
            <input type="text" id="lKey" class="kbd-input" maxlength="1" value="l" title="按键">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>遮罩层透明度 (0.0 - 1.0)</label>
        <input type="number" id="opacity" min="0" max="1" step="0.05" value="0.88">
      </div>
    </div>

    <div class="card">
      <div class="card-title">字幕外观配置</div>
      <div class="form-group">
        <label>字体大小 (px)</label>
        <input type="number" id="subFontSize" min="12" max="48" step="1" value="18">
      </div>

      <div class="form-group">
        <div class="row">
          <div style="flex:1;">
            <label>字体颜色</label>
            <input type="color" id="subFontColor" class="color-picker" value="#ffffff">
          </div>
          <div style="flex:1;">
            <label>背景颜色</label>
            <input type="color" id="subBgColor" class="color-picker" value="#000000">
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="row">
          <div style="flex:1;">
            <label>背景透明度 (0-1)</label>
            <input type="number" id="subBgOpacity" min="0" max="1" step="0.05" value="0.6">
          </div>
          <div style="flex:1;">
            <label>字体粗细</label>
            <select id="subFontWeight">
              <option value="400">常规 (Normal)</option>
              <option value="500" selected>中等 (Medium)</option>
              <option value="700">加粗 (Bold)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>底部偏移量 (px)</label>
        <input type="number" id="subBottomOffset" min="10" max="200" step="5" value="30">
      </div>
    </div>

    <button class="save-btn" id="save">保存偏好设置</button>
    <div class="tip-status" id="status">修改设置后即时生效</div>
  </div>

  <!-- 历史记录面板 -->
  <div id="historyTab" style="display:none;">
    <div class="history-header">
      <span class="history-sub">自动保留最新 90 条</span>
      <button id="clearHistoryBtn" class="clear-btn">清空全部</button>
    </div>
    <div id="historyList" class="history-list">
      <!-- 动态插入历史卡片 -->
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
