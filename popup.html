<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>影院模式设置</title>
  <style>
    :root {
      /* 默认暗色模式 Design Tokens */
      --bg-color: #0f1015;
      --text-main: #e4e4e7;
      --text-title: #ffffff;
      --text-muted: #71717a;
      --header-border: rgba(255, 255, 255, 0.08);
      
      --tabs-bg: rgba(255, 255, 255, 0.05);
      --tabs-border: rgba(255, 255, 255, 0.06);
      --tab-btn-text: #a1a1aa;
      --tab-active-bg: #27272a;
      --tab-active-text: #ffffff;
      --tab-active-shadow: rgba(0, 0, 0, 0.4);
      
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.07);
      --card-title: #94a3b8;
      
      --input-bg: #18181b;
      --input-border: #3f3f46;
      --input-text: #f4f4f5;
      
      --kbd-bg: #27272a;
      --kbd-border: #52525b;
      --kbd-shadow: rgba(0, 0, 0, 0.4);
      --kbd-text: #60a5fa;

      --history-item-bg: rgba(255, 255, 255, 0.03);
      --history-item-border: rgba(255, 255, 255, 0.06);
      --history-item-hover-bg: rgba(255, 255, 255, 0.06);
      --history-item-hover-border: rgba(255, 255, 255, 0.12);
      --history-title-color: #60a5fa;
    }

    @media (prefers-color-scheme: light) {
      :root {
        /* 设备亮色模式 Design Tokens */
        --bg-color: #f8fafc;
        --text-main: #334155;
        --text-title: #0f172a;
        --text-muted: #64748b;
        --header-border: #e2e8f0;
        
        --tabs-bg: #e2e8f0;
        --tabs-border: #cbd5e1;
        --tab-btn-text: #64748b;
        --tab-active-bg: #ffffff;
        --tab-active-text: #0f172a;
        --tab-active-shadow: rgba(148, 163, 184, 0.25);
        
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --card-title: #475569;
        
        --input-bg: #f8fafc;
        --input-border: #cbd5e1;
        --input-text: #0f172a;
        
        --kbd-bg: #ffffff;
        --kbd-border: #cbd5e1;
        --kbd-shadow: #cbd5e1;
        --kbd-text: #2563eb;

        --history-item-bg: #ffffff;
        --history-item-border: #e2e8f0;
        --history-item-hover-bg: #f1f5f9;
        --history-item-hover-border: #cbd5e1;
        --history-title-color: #2563eb;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      width: 280px;
      height: max-content;
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      overflow: hidden;
    }
    body {
      width: 280px;
      height: auto;
      margin: 0;
      padding: 10px;
      background: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      user-select: none;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* 顶部 Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--header-border);
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
      letter-spacing: -0.2px;
    }
    .brand-icon {
      width: 16px;
      height: 16px;
      color: #3b82f6;
    }

    /* 分段 Segmented Control (Tabs) */
    .tabs-container {
      display: flex;
      background: var(--tabs-bg);
      border-radius: 6px;
      padding: 2px;
      margin-bottom: 8px;
      border: 1px solid var(--tabs-border);
      width: 100%;
    }
    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: var(--tab-btn-text);
      padding: 5px 0;
      border-radius: 4.5px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: 0 2px 6px var(--tab-active-shadow);
    }
    .tab-btn:hover:not(.active) {
      color: var(--text-title);
    }
    .tab-icon {
      width: 12px;
      height: 12px;
      stroke-width: 2;
    }
    .badge {
      background: rgba(59, 130, 246, 0.18);
      color: #2563eb;
      font-size: 9.5px;
      font-weight: 600;
      padding: 1px 4.5px;
      border-radius: 8px;
      line-height: 1.2;
    }

    .tab-panel {
      width: 100%;
    }

    /* 卡片式区块 (Card Sections) */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      padding: 8px;
      margin-bottom: 8px;
      width: 100%;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--card-title);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 表单与输入框 */
    .form-group {
      margin-bottom: 6px;
      width: 100%;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .row {
      display: flex;
      gap: 5px;
      align-items: center;
      width: 100%;
    }

    input[type="number"], select, input[type="text"] {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      padding: 4.5px 7px;
      border-radius: 5px;
      font-size: 11.5px;
      outline: none;
      transition: all 0.15s ease;
      min-width: 0;
      width: 100%;
    }
    input[type="number"]:focus, select:focus, input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    /* 快捷键 KBD 单字符样式（紧凑固定小键帽） */
    .kbd-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-align: center;
      text-transform: lowercase;
      font-weight: 700;
      background: var(--kbd-bg) !important;
      border-color: var(--kbd-border) !important;
      box-shadow: inset 0 -2px 0 var(--kbd-shadow);
      color: var(--kbd-text) !important;
      width: 30px !important;
      height: 26px;
      padding: 0 !important;
      flex-shrink: 0;
    }

    /* 颜色选择器 Webkit 标准修正 */
    .color-picker {
      height: 26px;
      padding: 2px;
      cursor: pointer;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 5px;
      width: 100%;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 3px;
    }

    /* 主操作按钮 */
    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      padding: 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.15s ease;
    }
    .save-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }
    .save-btn:active {
      transform: translateY(0);
    }
    .tip-status {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      margin-bottom: 0;
      text-align: center;
      transition: color 0.2s;
      line-height: 1.2;
    }

    /* 历史记录 Tab 相关 */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      width: 100%;
    }
    .history-sub {
      font-size: 10px;
      color: var(--text-muted);
    }
    .clear-btn {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #dc2626;
    }

    .history-list {
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
    }
    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--input-border);
      border-radius: 4px;
    }

    .history-item {
      background: var(--history-item-bg);
      border: 1px solid var(--history-item-border);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      transition: all 0.15s ease;
      width: 100%;
    }
    .history-item:hover {
      background: var(--history-item-hover-bg);
      border-color: var(--history-item-hover-border);
      transform: translateY(-1px);
    }
    .history-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .history-title {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--history-title-color);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      width: 100%;
    }
    .history-title:hover {
      text-decoration: underline;
    }
    .history-time {
      font-size: 9.5px;
      color: var(--text-muted);
    }
    .history-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2.5px 4px;
      border-radius: 4px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .history-item:hover .history-delete-btn {
      opacity: 1;
    }
    .history-delete-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }
    .history-empty {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      width: 100%;
    }
    .history-empty-icon {
      font-size: 22px;
      margin-bottom: 3px;
      opacity: 0.6;
    }
    .history-empty-text {
      font-size: 11px;
    }
  </style>
</head>
<body>
  <!-- Header 头部品牌栏 -->
  <div class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      一键影院模式
    </div>
  </div>

  <!-- 分段选项卡 Segmented Control -->
  <div class="tabs-container">
    <button class="tab-btn active" id="tabSettingsBtn">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      偏好设置
    </button>
    <button class="tab-btn" id="tabHistoryBtn">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      观看历史 <span id="historyCount" class="badge">0</span>
    </button>
  </div>

  <!-- 偏好设置面板 -->
  <div id="settingsTab" class="tab-panel">
    <div class="card">
      <div class="card-title">快捷键与时间步长</div>
      <div class="form-group">
        <label>回退时长 & 触发键</label>
        <div class="row">
          <input type="number" id="jValue" min="1" step="any" value="60" style="flex:1;">
          <select id="jUnit" style="width: 52px; flex-shrink: 0;">
            <option value="s">秒</option>
            <option value="m" selected>分</option>
            <option value="h">时</option>
          </select>
          <div style="display:flex; align-items:center; gap:4px; flex-shrink: 0;">
            <span style="font-size:11px; color:var(--text-muted);">键:</span>
            <input type="text" id="jKey" class="kbd-input" maxlength="1" value="j" title="触发按键">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>快进时长 & 触发键</label>
        <div class="row">
          <input type="number" id="lValue" min="1" step="any" value="60" style="flex:1;">
          <select id="lUnit" style="width: 52px; flex-shrink: 0;">
            <option value="s">秒</option>
            <option value="m" selected>分</option>
            <option value="h">时</option>
          </select>
          <div style="display:flex; align-items:center; gap:4px; flex-shrink: 0;">
            <span style="font-size:11px; color:var(--text-muted);">键:</span>
            <input type="text" id="lKey" class="kbd-input" maxlength="1" value="l" title="触发按键">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>遮罩层透明度 (0.0 - 1.0)</label>
        <input type="number" id="opacity" min="0" max="1" step="0.05" value="0.88">
      </div>
    </div>

    <div class="card">
      <div class="card-title">字幕外观配置</div>
      <div class="form-group">
        <label>字体大小 (px)</label>
        <input type="number" id="subFontSize" min="12" max="48" step="1" value="18">
      </div>

      <div class="form-group">
        <div class="row">
          <div style="flex:1;">
            <label>字体颜色</label>
            <input type="color" id="subFontColor" class="color-picker" value="#ffffff">
          </div>
          <div style="flex:1;">
            <label>背景颜色</label>
            <input type="color" id="subBgColor" class="color-picker" value="#000000">
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="row">
          <div style="flex:1;">
            <label>背景透明度 (0-1)</label>
            <input type="number" id="subBgOpacity" min="0" max="1" step="0.05" value="0.6">
          </div>
          <div style="flex:1;">
            <label>字体粗细</label>
            <select id="subFontWeight">
              <option value="400">常规 (Normal)</option>
              <option value="500" selected>中等 (Medium)</option>
              <option value="700">加粗 (Bold)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>底部偏移量 (px)</label>
        <input type="number" id="subBottomOffset" min="10" max="200" step="5" value="30">
      </div>
    </div>

    <button class="save-btn" id="save">保存偏好设置</button>
    <div class="tip-status" id="status">修改设置后即时生效</div>
  </div>

  <!-- 历史记录面板 -->
  <div id="historyTab" class="tab-panel" style="display:none;">
    <div class="history-header">
      <span class="history-sub">自动保留播放满1分钟（最新90条）</span>
      <button id="clearHistoryBtn" class="clear-btn">清空全部</button>
    </div>
    <div id="historyList" class="history-list">
      <!-- 动态插入历史卡片 -->
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
